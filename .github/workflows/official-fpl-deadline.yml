name: Official FPL deadline snapshot
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-fpl-deadline-snapshot
  cancel-in-progress: false
jobs:
  deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deadline parser
        run: node --test tests/deadline.test.js
      - name: Fetch official deadline
        id: fetch
        continue-on-error: true
        run: node src/deadline-snapshot.js artifacts/fpl-deadline.json
      - name: Publish artifact for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fpl-deadline
          path: artifacts/fpl-deadline.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish readable snapshot to repository
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/fpl-deadline.json ]; then
            mkdir -p artifacts
            printf '%s\n' '{"status":"unverified","entry_id":1169933,"error":"Snapshot not generated"}' > artifacts/fpl-deadline.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/fpl-deadline.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(fpl): refresh official deadline snapshot [skip ci]"
            git push origin HEAD:master
          fi
      - name: Fail if official deadline unverified
        if: steps.fetch.outcome != 'success'
        run: exit 1

name: Verify FPL snapshot
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Fetch and validate live public squad
        run: |
          node src/cli.js > snapshot.json
          node src/engine-cli.js > engine.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const snapshot = JSON.parse(fs.readFileSync("snapshot.json", "utf8"));
          if (!snapshot || typeof snapshot !== "object") throw new Error("Snapshot is not a JSON object");
          if (!snapshot.gameweek || !Number.isInteger(snapshot.gameweek.id)) throw new Error("Snapshot has no valid gameweek");
          if (!Array.isArray(snapshot.squad)) throw new Error("Snapshot squad is not an array");
          if (snapshot.squad.length !== 15) throw new Error(`Expected 15 players, got ${snapshot.squad.length}`);
          for (const player of snapshot.squad) {
            if (!Number.isInteger(player.id) || typeof player.name !== "string" || !player.name) throw new Error("Invalid player record");
          }
          console.log("GW", snapshot.gameweek.id, snapshot.squad.map(({name}) => name).join(", "));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot
          path: |
            snapshot.json
            engine.json

name: Refresh FPL Command Center
on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: fpl-command-center-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Fetch and validate official FPL state
        run: |
          mkdir -p data
          node src/cli.js > data/current.json
          node src/engine-cli.js > data/engine.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=JSON.parse(fs.readFileSync("data/current.json","utf8"));
          if(s.entry_id!==1169933) throw new Error("Wrong FPL entry");
          if(!s.gameweek || !Number.isInteger(s.gameweek.id)) throw new Error("No valid gameweek");
          if(!Array.isArray(s.squad) || s.squad.length!==15) throw new Error("Expected 15 published picks");
          if(!s.manager || typeof s.manager.team_name!=="string") throw new Error("Missing manager state");
          if(!Array.isArray(s.transfers) || !Array.isArray(s.history)) throw new Error("Missing history/transfer state");
          console.log(JSON.stringify({
            entry:s.entry_id,
            gw:s.gameweek.id,
            points:s.gw_stats?.points,
            overall_points:s.manager.overall_points,
            overall_rank:s.manager.overall_rank,
            captain:s.captain?.name,
            squad:s.squad.map(x=>x.name)
          },null,2));
          NODE
      - name: Publish latest bridge snapshot
        run: |
          git config user.name "fpl-command-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json data/engine.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "chore: refresh official FPL state"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-command-center-state
          path: |
            data/current.json
            data/engine.json

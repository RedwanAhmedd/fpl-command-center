name: FPL Command Center evidence bridge
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fpl-evidence-bridge.yml'
      - 'src/snapshot.js'
      - 'src/decision.js'
      - 'src/engine.js'
      - 'src/fpl.js'
      - 'src/gw-autopsy.js'
permissions:
  contents: write
concurrency:
  group: fpl-evidence-bridge
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code
        run: npm test
      - name: Fetch verified public squad and gameweek history
        shell: bash
        run: |
          mkdir -p artifacts
          if node src/cli.js > artifacts/fpl-entry-snapshot.json.tmp; then
            node --input-type=module -e '
              import fs from "node:fs";
              const p=JSON.parse(fs.readFileSync("artifacts/fpl-entry-snapshot.json.tmp","utf8"));
              if(p.entry_id!==1169933 || !Array.isArray(p.squad) || p.squad.length!==15 || !Array.isArray(p.history) || !Number.isFinite(Date.parse(p.generated_at))) process.exit(1);
            ' && mv artifacts/fpl-entry-snapshot.json.tmp artifacts/fpl-entry-snapshot.json || {
              rm -f artifacts/fpl-entry-snapshot.json.tmp
              printf '{"entry_id":1169933,"status":"unverified","generated_at":"%s","error":"Official squad validation failed"}\n' "$(date -u +%FT%TZ)" > artifacts/fpl-entry-snapshot.json
            }
          else
            rm -f artifacts/fpl-entry-snapshot.json.tmp
            printf '{"entry_id":1169933,"status":"unverified","generated_at":"%s","error":"Official entry API fetch failed"}\n' "$(date -u +%FT%TZ)" > artifacts/fpl-entry-snapshot.json
          fi
      - name: Generate decision evidence
        shell: bash
        run: |
          if node src/engine-cli.js > artifacts/fpl-engine.json.tmp; then
            node --input-type=module -e '
              import fs from "node:fs";
              const p=JSON.parse(fs.readFileSync("artifacts/fpl-engine.json.tmp","utf8"));
              if(!p || typeof p!=="object") process.exit(1);
            ' && mv artifacts/fpl-engine.json.tmp artifacts/fpl-engine.json || {
              rm -f artifacts/fpl-engine.json.tmp
              printf '{"entry_id":1169933,"status":"unverified","generated_at":"%s"}\n' "$(date -u +%FT%TZ)" > artifacts/fpl-engine.json
            }
          else
            rm -f artifacts/fpl-engine.json.tmp
            printf '{"entry_id":1169933,"status":"unverified","generated_at":"%s"}\n' "$(date -u +%FT%TZ)" > artifacts/fpl-engine.json
          fi
      - name: Build official completed-GW autopsy
        shell: bash
        run: |
          node src/gw-autopsy.js artifacts/fpl-gw-autopsy.json || true
      - name: Publish readable evidence to default branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/fpl-entry-snapshot.json artifacts/fpl-engine.json artifacts/fpl-gw-autopsy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(fpl): refresh public squad and decision evidence [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then exit 0; fi
              git fetch origin master
              git rebase origin/master || exit 1
              sleep "$attempt"
            done
            exit 1
          fi
